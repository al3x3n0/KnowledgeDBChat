{{- if .Values.qdrant.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-qdrant" (include "kdbc.fullname" .) }}
  labels:
    {{- include "kdbc.componentLabels" (dict "ctx" . "component" "qdrant") | nindent 4 }}
spec:
  ports:
    - name: http
      port: {{ .Values.qdrant.service.httpPort }}
      targetPort: http
    - name: grpc
      port: {{ .Values.qdrant.service.grpcPort }}
      targetPort: grpc
  selector:
    {{- include "kdbc.componentSelectorLabels" (dict "ctx" . "component" "qdrant") | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ printf "%s-qdrant" (include "kdbc.fullname" .) }}
  labels:
    {{- include "kdbc.componentLabels" (dict "ctx" . "component" "qdrant") | nindent 4 }}
spec:
  serviceName: {{ printf "%s-qdrant" (include "kdbc.fullname" .) }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "kdbc.componentSelectorLabels" (dict "ctx" . "component" "qdrant") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kdbc.componentSelectorLabels" (dict "ctx" . "component" "qdrant") | nindent 8 }}
    spec:
      {{- include "kdbc.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: qdrant
          image: "{{ .Values.qdrant.image.repository }}:{{ .Values.qdrant.image.tag }}"
          imagePullPolicy: {{ .Values.qdrant.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
          {{- if .Values.secrets.qdrantApiKey }}
          env:
            - name: QDRANT__SERVICE__API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "kdbc.secretName" . }}
                  key: QDRANT_API_KEY
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            {{- toYaml .Values.qdrant.resources | nindent 12 }}
      {{- if not .Values.qdrant.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- else if .Values.qdrant.persistence.existingClaim }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.qdrant.persistence.existingClaim }}
      {{- end }}
  {{- if and .Values.qdrant.persistence.enabled (not .Values.qdrant.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.qdrant.persistence.size }}
        {{- include "kdbc.storageClass" (dict "ctx" . "sc" .Values.qdrant.persistence.storageClass) | nindent 8 }}
  {{- end }}
{{- end }}
