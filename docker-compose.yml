services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: knowledge_db_postgres
    environment:
      POSTGRES_DB: knowledge_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      # Bind-mount DB data to host FS to reduce Docker Desktop disk usage
      - ./data/postgres_data:/var/lib/postgresql/data
      - ./data/postgres-init:/docker-entrypoint-initdb.d
    networks:
      - knowledge_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d knowledge_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Redis for caching and task queue
  redis:
    image: redis:7-alpine
    container_name: knowledge_db_redis
    ports:
      - "6379:6379"
    volumes:
      # Bind-mount Redis data to host FS to reduce Docker Desktop disk usage
      - ./data/redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - knowledge_net

  # Qdrant Vector Database (default; set VECTOR_STORE_PROVIDER=chroma to use embedded ChromaDB)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: knowledge_db_qdrant
    ports:
      - "6333:6333"
    volumes:
      # Bind-mount Qdrant storage to host FS to reduce Docker Desktop disk usage
      - ./data/qdrant_data:/qdrant/storage
    networks:
      - knowledge_net

  # MinIO for object storage
  minio:
    image: minio/minio:latest
    container_name: knowledge_db_minio
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    volumes:
      # Bind-mount MinIO data to host FS to reduce Docker Desktop disk usage
      - ./data/minio_data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    networks:
      - knowledge_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: knowledge_db_backend:latest  # Tag image so celery can reuse it
    container_name: knowledge_db_backend
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/knowledge_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEFAULT_MODEL=llama3.2:1b  # Force smallest model for Mac
      - CHROMA_PERSIST_DIRECTORY=/app/data/chroma_db
      # Vector store: "qdrant" (default) or "chroma"
      - VECTOR_STORE_PROVIDER=qdrant
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION_NAME=knowledge_base
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=documents
      - MINIO_USE_SSL=false
      - MINIO_PRESIGNED_URL_EXPIRY=3600
      - MINIO_PROXY_BASE_URL=http://localhost:3000/minio
      - CHROMA_TELEMETRY_ENABLED=false
      - SECRET_KEY=your-secret-key-here  # Must match JWT_SECRET in video-streamer
      # Backpressure / pool tuning for dev stability (avoid exhausting Postgres connections)
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=10
      - DB_POOL_TIMEOUT_SECONDS=5
      - DB_SESSION_ACQUIRE_TIMEOUT_SECONDS=2
      # Kroki for local Mermaid diagram rendering
      - KROKI_URL=http://kroki-mermaid:8002
      # Transcription configuration
      # Note: "large" / "turbo" can exceed typical Docker Desktop memory budgets.
      # We default to "small" for reliability; you can switch to "medium"/"large" once Docker has enough RAM.
      - WHISPER_MODEL_SIZE=small
      - WHISPER_DEVICE=auto
      - TRANSCRIPTION_LANGUAGE=auto
      - TRANSCRIPTION_SKIP_INITIAL_SECONDS=2.0
      - TRANSCRIPTION_SPEAKER_DIARIZATION=false
      # Require local Whisper weights (avoids runtime network/TLS issues).
      - WHISPER_OFFLINE=1
      # Don't block API startup on large model downloads; preload can be enabled when needed.
      - PRELOAD_WHISPER_MODEL=false
      # Run migrations in the background so the API can start serving immediately.
      - RUN_ALEMBIC_MIGRATIONS=true
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend:/app
      # Mount Whisper model cache directory
      - ./data/whisper_models:/root/.cache/knowledge_db_transcriber
      # Bind-mount HF cache to host FS to avoid filling container layer (common on Docker Desktop)
      - ./data/hf_cache:/root/.cache/huggingface
      - ./data/pip_cache:/root/.cache/pip
      - ./data/torch_cache:/root/.cache/torch
      - ./data/yt_dlp_cache:/root/.cache/yt-dlp
    depends_on:
      - postgres
      - redis
      - qdrant
      - minio
    networks:
      - knowledge_net
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app --reload-include "main.py" --timeout-graceful-shutdown 2 --reload-delay 0.25
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Video Streaming Service (Go microservice)
  video-streamer:
    build:
      context: ./video-streamer
      dockerfile: Dockerfile
    container_name: knowledge_db_video_streamer
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=documents
      - MINIO_USE_SSL=false
      - JWT_SECRET=your-secret-key-here # Must match backend SECRET_KEY
      - BACKEND_API_URL=http://backend:8000/api/v1/documents
      - PORT=8080
      - CORS_ORIGIN=*
      - DATABASE_URL=postgresql://user:password@postgres:5432/knowledge_db
    ports:
      - "8080:8080"
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - knowledge_net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Kroki for local diagram rendering (Mermaid, PlantUML, etc.)
  # Mermaid rendering. The service keeps its name because KROKI_URL and
  # KROKI_LOCAL_IS_COMPANION still point at it and it still speaks the Kroki
  # companion protocol -- POST the raw diagram to /svg or /png. What changed is
  # what serves it: yuzutech/kroki-mermaid is 1.54 GB, this is 1.08 GB, and the
  # difference is a JVM, npm, and ~190 MB of mesa and libLLVM that a headless
  # Chromium rasterising an SVG never opens.
  kroki-mermaid:
    build:
      context: ./mermaid-renderer
      dockerfile: Dockerfile
    image: knowledge_db_mermaid_renderer:latest
    container_name: knowledge_db_kroki_mermaid
    ports:
      - "8001:8002"
    networks:
      - knowledge_net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--output-document=/dev/null", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: knowledge_db_frontend
    # Don't expose port directly - nginx will proxy to it
    expose:
      - "3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:3000
      - REACT_APP_WS_URL=ws://localhost:3000
    depends_on:
      - backend
    networks:
      - knowledge_net
    command: npm start

  # Nginx reverse proxy (frontend, API, and MinIO)
  nginx:
    image: nginx:alpine
    container_name: knowledge_db_nginx
    ports:
      - "3000:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - minio
      - frontend
    networks:
      - knowledge_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Celery worker for background tasks
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: knowledge_db_backend:latest  # Share image with backend to avoid duplicate builds
    container_name: knowledge_db_celery
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/knowledge_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # Vector store: "qdrant" (default) or "chroma"
      - VECTOR_STORE_PROVIDER=qdrant
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION_NAME=knowledge_base
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=documents
      - MINIO_USE_SSL=false
      - MINIO_PRESIGNED_URL_EXPIRY=3600
      - MINIO_PROXY_BASE_URL=http://localhost:3000/minio
      - CHROMA_TELEMETRY_ENABLED=false
      # Kroki for local Mermaid diagram rendering
      - KROKI_URL=http://kroki-mermaid:8002
      # Transcription configuration
      # Note: "large" / "turbo" can exceed typical Docker Desktop memory budgets.
      # We default to "small" for reliability; you can switch to "medium"/"large" once Docker has enough RAM.
      - WHISPER_MODEL_SIZE=small
      - WHISPER_DEVICE=auto
      - TRANSCRIPTION_LANGUAGE=auto
      - TRANSCRIPTION_SKIP_INITIAL_SECONDS=2.0
      - TRANSCRIPTION_SPEAKER_DIARIZATION=false
      # Require local Whisper weights (avoids runtime network/TLS issues).
      - WHISPER_OFFLINE=1
      # Avoid blocking worker startup on model downloads; enable if you want warm transcriptions.
      - PRELOAD_WHISPER_MODEL=false
      # Only the API service should run migrations.
      - RUN_ALEMBIC_MIGRATIONS=false
      # Prevent OpenBLAS hangs in forked Celery workers while allowing parallelism
      - OPENBLAS_MAIN_FREE=1
      - GOTO_NUM_THREADS=4
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
    volumes:
      - ./data:/app/data
      - ./backend:/app
      # Mount Whisper model cache directory (shared with backend)
      - ./data/whisper_models:/root/.cache/knowledge_db_transcriber
      # Bind-mount HF cache to host FS to avoid filling container layer (common on Docker Desktop)
      - ./data/hf_cache:/root/.cache/huggingface
      - ./data/pip_cache:/root/.cache/pip
      - ./data/torch_cache:/root/.cache/torch
      - ./data/yt_dlp_cache:/root/.cache/yt-dlp
    depends_on:
      - postgres
      - redis
      - qdrant
      - minio
      - kroki-mermaid
    networks:
      - knowledge_net
    command: celery -A app.core.celery worker --loglevel=info
    # Increase container memory (compose-only) and shared memory to handle larger models
    mem_limit: 6g
    shm_size: 2gb
    # Optional Swarm-style limits (ignored by plain compose but useful if deployed via Swarm)
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "celery", "-A", "app.core.celery", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery beat scheduler.
  #
  # Without this, nothing on beat_schedule ever fires, which for agent work
  # means the periodic tasks that make a long-running job durable never run:
  # process_scheduled_agent_jobs (every 5m), check_stalled_agent_jobs (10m),
  # and resume_paused_agent_jobs (15m). A job whose worker dies then stays
  # dead. That was only defined in docker-compose.prod.yml, so the recovery
  # path could not be exercised in development at all.
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: knowledge_db_backend:latest
    container_name: knowledge_db_celery_beat
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/knowledge_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - VECTOR_STORE_PROVIDER=qdrant
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION_NAME=knowledge_base
      # The scheduler only enqueues; workers do the work and run migrations.
      - RUN_ALEMBIC_MIGRATIONS=false
    volumes:
      - ./data:/app/data
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    networks:
      - knowledge_net
    # The schedule file lives in a writable path that is not bind-mounted from
    # the host, so a stale schedule cannot survive a rebuild and silently
    # suppress runs.
    command: celery -A app.core.celery beat --loglevel=info --schedule /tmp/celerybeat-schedule

  # Dedicated Celery worker for LaTeX compilation (recommended to isolate heavy/unsafe workloads)
  celery_latex:
    build:
      context: ./backend
      dockerfile: Dockerfile.latex-worker
    image: knowledge_db_latex_worker:latest
    container_name: knowledge_db_celery_latex
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/knowledge_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=documents
      - MINIO_USE_SSL=false
      - MINIO_PRESIGNED_URL_EXPIRY=3600
      - MINIO_PROXY_BASE_URL=http://localhost:3000/minio
      - CHROMA_TELEMETRY_ENABLED=false
      - RUN_ALEMBIC_MIGRATIONS=false
      - PYTHONDONTWRITEBYTECODE=1
      - LOG_FILE=/tmp/logs/app.log
      - OPENBLAS_MAIN_FREE=1
      - GOTO_NUM_THREADS=1
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - knowledge_net
    command: celery -A app.core.celery_latex worker -Q latex --loglevel=info --concurrency=1
    mem_limit: 2g
    shm_size: 512mb
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Dedicated Celery worker for transcription.
  #
  # Whisper, librosa, speechbrain and resemblyzer -- and numba and llvmlite
  # under them -- are ~250 MB that the API, the general worker and beat all
  # carried to run something only this worker performs. They now live in one
  # image, built FROM knowledge_db_backend:latest, so the shared layers are
  # stored once and only this service adds to them.
  #
  # BUILD ORDER: this derives from the backend image, and compose does not
  # infer build order from a FROM. `make build` orders them; a bare
  # `docker compose build celery_transcription` on a clean machine fails
  # looking for a base image that is not there yet.
  #
  # Stop this service and transcription requests queue rather than fail --
  # the same contract the latex queue has.
  celery_transcription:
    build:
      context: ./backend
      dockerfile: Dockerfile.transcription-worker
    image: knowledge_db_transcription_worker:latest
    container_name: knowledge_db_celery_transcription
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/knowledge_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=documents
      - MINIO_USE_SSL=false
      - MINIO_PRESIGNED_URL_EXPIRY=3600
      - MINIO_PROXY_BASE_URL=http://localhost:3000/minio
      # Transcription configuration. Kept identical to the general worker's so
      # that moving the task between them cannot change a transcript.
      - WHISPER_MODEL_SIZE=small
      - WHISPER_DEVICE=auto
      - TRANSCRIPTION_LANGUAGE=auto
      - TRANSCRIPTION_SKIP_INITIAL_SECONDS=2.0
      - TRANSCRIPTION_SPEAKER_DIARIZATION=false
      - WHISPER_OFFLINE=1
      # This is now the only image that can honour a preload: it is the one
      # with Whisper in it. Set to "true" for warm first transcriptions.
      - PRELOAD_WHISPER_MODEL=false
      - RUN_ALEMBIC_MIGRATIONS=false
      - OPENBLAS_MAIN_FREE=1
      - GOTO_NUM_THREADS=4
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
    volumes:
      - ./data:/app/data
      - ./backend:/app
      - ./data/whisper_models:/root/.cache/knowledge_db_transcriber
      - ./data/hf_cache:/root/.cache/huggingface
      - ./data/torch_cache:/root/.cache/torch
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - knowledge_net
    command: celery -A app.core.celery_transcription worker -Q transcription --loglevel=info --concurrency=1
    # Whisper "small" plus a long decode; the general worker's 6g was sized for
    # this workload when it still ran there.
    mem_limit: 6g
    shm_size: 2gb
    healthcheck:
      test: ["CMD", "celery", "-A", "app.core.celery_transcription", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  knowledge_net:
    driver: bridge
