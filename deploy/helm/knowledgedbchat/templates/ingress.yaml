{{- if .Values.ingress.enabled }}
{{- $svcName := printf "%s-gateway" (include "kdbc.fullname" .) }}
{{- $svcPort := .Values.gateway.service.port }}
{{- if not .Values.gateway.enabled }}
{{- fail "ingress.enabled=true requires gateway.enabled=true (the ingress fronts the gateway)" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kdbc.fullname" . }}
  labels:
    {{- include "kdbc.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $svcName }}
                port:
                  number: {{ $svcPort }}
          {{- end }}
    {{- end }}
{{- end }}
