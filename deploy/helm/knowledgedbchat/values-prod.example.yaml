# Production-shaped example. Copy, edit, and keep secrets OUT of it - use
# secrets.existingSecret with sealed-secrets / external-secrets / SOPS instead.
#
#   helm upgrade --install kdbc deploy/helm/knowledgedbchat \
#     -n knowledgedbchat --create-namespace -f my-values.yaml

global:
  storageClass: ""            # set to your RWO class, e.g. gp3 / premium-rwo
  imagePullSecrets:
    - name: registry-credentials

image:
  backend:
    repository: registry.example.com/knowledgedbchat/backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  latexWorker:
    repository: registry.example.com/knowledgedbchat/latex-worker
    tag: "1.0.0"
  frontend:
    repository: registry.example.com/knowledgedbchat/frontend
    tag: "1.0.0"
  videoStreamer:
    repository: registry.example.com/knowledgedbchat/video-streamer
    tag: "1.0.0"

secrets:
  create: false
  # Must contain: SECRET_KEY, POSTGRES_PASSWORD, REDIS_PASSWORD,
  # MINIO_ACCESS_KEY, MINIO_SECRET_KEY, plus any provider API keys
  # (OPENAI_API_KEY, ANTHROPIC_API_KEY, ...) and SECRETS_ENCRYPTION_KEY.
  # With LDAP below, also LDAP_BIND_PASSWORD (the service account's).
  existingSecret: knowledgedbchat-secrets
  # Set this to a non-empty placeholder when the managed Secret enables Redis
  # auth: the chart uses it only to decide whether to build a redis:// URL with
  # credentials, never as the password itself.
  redisPassword: "managed-externally"

config:
  logLevel: INFO
  llmProvider: anthropic
  minioProxyBaseUrl: "https://kdbc.example.com/minio"
  extra:
    RAG_HYBRID_SEARCH_ENABLED: "true"
    RAG_RERANKING_ENABLED: "true"
    # Directory sign-in (optional). Every LDAP_* setting goes here except the
    # service account's password, which belongs in the Secret. Check it from
    # Admin -> Directory (LDAP) -> Run test once it is deployed.
    # LDAP_ENABLED: "true"
    # LDAP_URI: "ldaps://dc01.corp.example.com:636"
    # LDAP_BASE_DN: "DC=corp,DC=example,DC=com"
    # LDAP_BIND_DN: "CN=svc-kdbc,OU=Service Accounts,DC=corp,DC=example,DC=com"
    # LDAP_USER_SEARCH_FILTER: "(&(objectClass=user)(sAMAccountName={username}))"
    # LDAP_USERNAME_ATTRIBUTE: "sAMAccountName"
    # Several group DNs are separated by ";" (a DN contains commas).
    # LDAP_ADMIN_GROUP_DNS: "CN=KB Admins,OU=Groups,DC=corp,DC=example,DC=com"
    # An internal CA: mount its bundle and name it, rather than skipping
    # verification with LDAP_INSECURE_SKIP_TLS_VERIFY.
    # LDAP_CA_CERT_FILE: "/etc/ssl/corp/ca.pem"
    AGENT_REQUIRE_TOOL_APPROVAL: "true"
    LATEX_COMPILER_ENABLED: "true"

backend:
  replicaCount: 3
  workers: 4
  # Per process, and there are up to 12 replicas x 4 workers = 48 of them:
  # 10 each is 480 connections at the autoscaler's ceiling. The default pool
  # (30) would be 1,440. The chart checks this against
  # postgres.external.maxConnections below.
  dbPool:
    size: 5
    maxOverflow: 5
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  persistence:
    # Must be a real RWX class (EFS, Filestore, CephFS, Azure Files): backend,
    # celery and beat all mount /app/data at the same time.
    accessMode: ReadWriteMany
    storageClass: efs-sc
    size: 200Gi
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      memory: 8Gi

celery:
  replicaCount: 3
  concurrency: 4
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10

celeryAgents:
  # Scaled by replicas, by hand: agent jobs wait on a model, so CPU says
  # nothing about how many are queued. Watch the agents queue length instead.
  replicaCount: 2
  concurrency: 4

celeryLatex:
  enabled: true
  replicaCount: 2

celeryTranscription:
  # One is usually enough: transcription is CPU-bound and serialized per file,
  # and this is the only pod that pulls the Whisper image.
  enabled: true
  replicaCount: 1

gateway:
  replicaCount: 3

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2048m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: kdbc.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: kdbc-tls
      hosts:
        - kdbc.example.com

networkPolicy:
  enabled: true

# Prefer managed data services in production; the in-chart StatefulSets are
# single-replica and have no backup story.
postgres:
  enabled: false
  external:
    host: kdbc-db.abc123.eu-west-1.rds.amazonaws.com
    port: 5432
    # Your instance's max_connections (SHOW max_connections), or the limit of
    # the PgBouncer / RDS Proxy in front of it. The chart refuses to render if
    # the API's pools cannot fit; 0 would skip that check.
    maxConnections: 600
    database: knowledge_db
    username: kdbc

redis:
  enabled: false
  external:
    host: kdbc-cache.abc123.ng.0001.euw1.cache.amazonaws.com
    port: 6379

qdrant:
  enabled: false
  external:
    url: "https://xyz.eu-west-1-0.aws.cloud.qdrant.io:6333"

minio:
  enabled: false
  external:
    endpoint: "s3.eu-west-1.amazonaws.com"
    useSSL: true

ollama:
  enabled: false
