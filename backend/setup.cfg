[flake8]
max-line-length = 88
extend-ignore = E203,E501
# Without this, a local run walks the virtualenv and dies inside a vendored
# sympy module. The Docker image has no venv, so `make lint` never hit it.
exclude =
    .git,
    __pycache__,
    venv,
    .venv,
    node_modules,
    build,
    dist
per-file-ignores =
    __init__.py:F401
    app/agent_core/__init__.py:E402,F401
    app/api/endpoints/agent.py:E402
    app/services/data_analysis_tools.py:E402
    app/services/vector_store.py:E402
    main.py:E402

[isort]
profile = black
