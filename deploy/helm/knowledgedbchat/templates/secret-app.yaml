{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-secrets" (include "kdbc.fullname" .) }}
  labels:
    {{- include "kdbc.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Every key is a valid environment-variable name so pods can `envFrom` this
  # Secret directly.
  SECRET_KEY: {{ required "secrets.secretKey is required" .Values.secrets.secretKey | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required" .Values.secrets.postgresPassword | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  MINIO_ACCESS_KEY: {{ required "secrets.minioRootUser is required" .Values.secrets.minioRootUser | quote }}
  MINIO_SECRET_KEY: {{ required "secrets.minioRootPassword is required" .Values.secrets.minioRootPassword | quote }}
{{- with .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ . | quote }}
{{- end }}
{{- with .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ . | quote }}
{{- end }}
{{- with .Values.secrets.deepseekApiKey }}
  DEEPSEEK_API_KEY: {{ . | quote }}
{{- end }}
{{- with .Values.secrets.qwenApiKey }}
  QWEN_API_KEY: {{ . | quote }}
{{- end }}
{{- with .Values.secrets.kimiApiKey }}
  KIMI_API_KEY: {{ . | quote }}
{{- end }}
{{- with .Values.secrets.qdrantApiKey }}
  QDRANT_API_KEY: {{ . | quote }}
{{- end }}
{{- with .Values.secrets.secretsEncryptionKey }}
  SECRETS_ENCRYPTION_KEY: {{ . | quote }}
{{- end }}
{{- range $key, $value := .Values.secrets.extra }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
