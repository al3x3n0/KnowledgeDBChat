# Local override: route the LLM stack at DeepSeek instead of Ollama, and turn on
# Docker-backed sandbox execution for scientific-validation runs.
#
# The API key comes from the (gitignored) root .env file. Sandbox execution also
# needs docker-compose.docker-tools.yml, which mounts the Docker socket:
#   docker compose -f docker-compose.yml -f docker-compose.override.yml \
#                  -f docker-compose.docker-tools.yml up -d
services:
  backend:
    environment:
      - LLM_PROVIDER=deepseek
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=deepseek-v4-pro
      - DEFAULT_MODEL=deepseek-v4-pro
      - ENABLE_UNSAFE_CODE_EXECUTION=true
      - UNSAFE_CODE_EXEC_BACKEND=docker
      - UNSAFE_CODE_EXEC_TIMEOUT_SECONDS=600
      - LLM_CALL_SNAPSHOT_ENABLED=true

  celery:
    environment:
      - LLM_PROVIDER=deepseek
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=deepseek-v4-pro
      - DEFAULT_MODEL=deepseek-v4-pro
      - ENABLE_UNSAFE_CODE_EXECUTION=true
      - UNSAFE_CODE_EXEC_BACKEND=docker
      - UNSAFE_CODE_EXEC_TIMEOUT_SECONDS=600
      - LLM_CALL_SNAPSHOT_ENABLED=true
