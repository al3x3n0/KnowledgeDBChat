{{- if .Values.kroki.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-kroki" (include "kdbc.fullname" .) }}
  labels:
    {{- include "kdbc.componentLabels" (dict "ctx" . "component" "kroki") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "kdbc.componentSelectorLabels" (dict "ctx" . "component" "kroki") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kdbc.componentSelectorLabels" (dict "ctx" . "component" "kroki") | nindent 8 }}
    spec:
      {{- include "kdbc.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: kroki
          image: "{{ .Values.kroki.image.repository }}:{{ .Values.kroki.image.tag }}"
          imagePullPolicy: {{ .Values.kroki.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: KROKI_MAX_URI_LENGTH
              value: "8000"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.kroki.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-kroki" (include "kdbc.fullname" .) }}
  labels:
    {{- include "kdbc.componentLabels" (dict "ctx" . "component" "kroki") | nindent 4 }}
spec:
  ports:
    - name: http
      port: {{ .Values.kroki.service.port }}
      targetPort: http
  selector:
    {{- include "kdbc.componentSelectorLabels" (dict "ctx" . "component" "kroki") | nindent 4 }}
{{- end }}
